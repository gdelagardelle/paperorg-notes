name: PaperorgNotes
options:
  bundleIdPrefix: com.paperorg
  developmentLanguage: en
  knownRegions:
    - en
    - fr
    - de
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "CZY6SHVSXB"
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  configs:
    Debug:
      # Local notes-api for auth, dev Pro, and transcription — no live Platform needed.
      PAPERORG_PRO_BACKEND_URL: "http://127.0.0.1:8080"
      PAPERORG_PLATFORM_API_URL: "http://127.0.0.1:8000"
      PAPERORG_USE_PLATFORM_AUTH: "NO"
      APP_ATTEST_ENVIRONMENT: development
    Release:
      # Platform owns account identity, entitlements, and subscription state.
      PAPERORG_PRO_BACKEND_URL: "https://notes-api.paperorg.com"
      PAPERORG_PLATFORM_API_URL: "https://poplatform.paperorg.com"
      PAPERORG_USE_PLATFORM_AUTH: "YES"
      APP_ATTEST_ENVIRONMENT: production

targets:
  PaperorgNotes:
    type: application
    platform: iOS
    sources:
      - path: PaperorgNotes
    entitlements:
      path: PaperorgNotes/Resources/PaperorgNotes.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.paperorg.voicenotes
        com.apple.developer.devicecheck.appattest-environment: $(APP_ATTEST_ENVIRONMENT)
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.paperorg.voicenotes
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.paperorg.voicenotes
    info:
      path: PaperorgNotes/Resources/Info.plist
      properties:
        CFBundleDisplayName: Paperorg Notes
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Paperorg Notes needs microphone access to record voice notes and meetings.
        NSSpeechRecognitionUsageDescription: Paperorg Notes uses speech recognition for on-device English transcription.
        NSFaceIDUsageDescription: Paperorg Notes uses Face ID to protect your private notes.
        UIBackgroundModes:
          - audio
        UILaunchStoryboardName: LaunchScreen
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.paperorg.voicenotes
            CFBundleURLSchemes:
              - paperorgnotes
        PAPERORG_PRO_BACKEND_URL: $(PAPERORG_PRO_BACKEND_URL)
        PAPERORG_PLATFORM_API_URL: $(PAPERORG_PLATFORM_API_URL)
        PAPERORG_USE_PLATFORM_AUTH: $(PAPERORG_USE_PLATFORM_AUTH)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paperorg.voicenotes
        MARKETING_VERSION: "1.0.10"
        CURRENT_PROJECT_VERSION: "78"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: PaperorgNotes/Resources/PaperorgNotes.entitlements
      # Signing is automatic for the whole project (see settings.base). The
      # Release override used to pin a manually managed App Store profile from
      # the personal team; those profiles cannot exist under Luxxow, and an
      # explicit CODE_SIGN_IDENTITY conflicts with automatic signing.
    dependencies:
      - target: PaperorgNotesWidgetExtension
        embed: true

  PaperorgNotesWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PaperorgNotesWidget
    resources:
      - path: PaperorgNotesWidget/Assets.xcassets
    entitlements:
      path: PaperorgNotesWidget/PaperorgNotesWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.paperorg.voicenotes
    info:
      path: PaperorgNotesWidget/Info.plist
      properties:
        CFBundleDisplayName: Paperorg Notes Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paperorg.voicenotes.widget
        MARKETING_VERSION: "1.0.10"
        CURRENT_PROJECT_VERSION: "78"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: PaperorgNotesWidget/PaperorgNotesWidget.entitlements
        SKIP_INSTALL: YES

  PaperorgNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PaperorgNotesTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.paperorg.voicenotes.tests
    dependencies:
      - target: PaperorgNotes

  PaperorgNotesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PaperorgNotesUITests
        excludes:
          - AppReviewDemoUITest.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.paperorg.voicenotes.uitests
    dependencies:
      - target: PaperorgNotes

  PaperorgNotesMac:
    type: application
    platform: macOS
    sources:
      - path: PaperorgNotesMac
      - path: PaperorgNotes
        excludes:
          - App/PaperorgNotesApp.swift
          - App/MainTabView.swift
          - Intents
          - Views/Settings/ExportBrandingSettingsSection.swift
          - Resources/LaunchScreen.storyboard
          - Resources/Info.plist
          - Resources/PaperorgNotes.entitlements
          - Resources/PaperorgPro.storekit
    resources:
      - path: PaperorgNotes/Resources/Assets.xcassets
      - path: PaperorgNotes/Resources/Localizable.xcstrings
      - path: PaperorgNotes/Resources/PrivacyInfo.xcprivacy
    entitlements:
      path: PaperorgNotesMac/Resources/PaperorgNotesMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.paperorg.voicenotes
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.paperorg.voicenotes
    info:
      path: PaperorgNotesMac/Resources/Info.plist
      properties:
        CFBundleDisplayName: Paperorg Notes
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Paperorg Notes needs microphone access to record voice notes and meetings.
        NSSpeechRecognitionUsageDescription: Paperorg Notes uses speech recognition for on-device English transcription.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.paperorg.voicenotes.mac
            CFBundleURLSchemes:
              - paperorgnotes
        PAPERORG_PRO_BACKEND_URL: $(PAPERORG_PRO_BACKEND_URL)
        PAPERORG_PLATFORM_API_URL: $(PAPERORG_PLATFORM_API_URL)
        PAPERORG_USE_PLATFORM_AUTH: $(PAPERORG_USE_PLATFORM_AUTH)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paperorg.voicenotes.mac
        MARKETING_VERSION: "1.0.10"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: PaperorgNotesMac/Resources/PaperorgNotesMac.entitlements
    dependencies: []

schemes:
  PaperorgNotesMac:
    build:
      targets:
        PaperorgNotesMac: all
    run:
      config: Debug
      storeKitConfiguration: PaperorgNotes/Resources/PaperorgPro.storekit
    test:
      targets: []

  PaperorgNotes:
    build:
      targets:
        PaperorgNotes: all
        PaperorgNotesWidgetExtension: all
    run:
      config: Debug
      storeKitConfiguration: PaperorgNotes/Resources/PaperorgPro.storekit
    test:
      targets:
        - PaperorgNotesTests
        - PaperorgNotesUITests
